name: Promote New Content

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosspost:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Preview cross-posts
        uses: tgagor/action-crosspost@4fca5f19e42f652d76dd3b12b334f29494bef30b # v1
        with:
          dry-run: true
          feed-url: https://kunlong-luo.github.io/resume-craft/sitemap.xml
          since: '7'
          since-unit: days
          limit: '1'
          failure-strategy: continue
          lastmod-required: error
          filter-urls: |
            /resume-craft/
          message: |
            {description}
            {url}

            #resume #markdown #opensource {tags}

          # Add only the networks you actually want to use, then switch
          # dry-run to false. Store every credential in GitHub Actions Secrets.
          #
          # bluesky-host: bsky.social
          # bluesky-identifier: ${{ secrets.BLUESKY_IDENTIFIER }}
          # bluesky-password: ${{ secrets.BLUESKY_PASSWORD }}
          #
          # mastodon-host: mastodon.social
          # mastodon-access-token: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          #
          # devto-api-key: ${{ secrets.DEVTO_API_KEY }}
          #
          # discord-webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
