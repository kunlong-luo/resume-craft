name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version (for example 2.0.1)
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "Manual releases must run from the main branch."
              exit 1
            fi
            VERSION="${INPUT_VERSION}"
            SHOULD_RELEASE=true
          else
            VERSION="${PACKAGE_VERSION}"

            if [ -z "${BEFORE_SHA}" ] || printf '%s' "${BEFORE_SHA}" | grep -Eq '^0+$'; then
              PREVIOUS_VERSION=""
            else
              PREVIOUS_VERSION="$(git show "${BEFORE_SHA}:package.json" 2>/dev/null | node -e "let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>console.log(JSON.parse(d).version))" || true)"
            fi

            if [ "${PREVIOUS_VERSION}" = "${VERSION}" ]; then
              echo "package.json changed without a version bump; no release is needed."
              SHOULD_RELEASE=false
            else
              echo "Detected version change: ${PREVIOUS_VERSION:-unknown} -> ${VERSION}"
              SHOULD_RELEASE=true
            fi
          fi

          TAG="v${VERSION}"

          if [ "${SHOULD_RELEASE}" = "true" ]; then
            if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Release versions must be stable SemVer only, for example 2.0.1."
              echo "Pre-release versions such as alpha, beta, rc, canary, next, or nightly are not allowed."
              exit 1
            fi

            if [ "${PACKAGE_VERSION}" != "${VERSION}" ]; then
              echo "package.json version (${PACKAGE_VERSION}) does not match release version (${VERSION})."
              exit 1
            fi
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${SHOULD_RELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Enforce stable dependency policy
        if: steps.version.outputs.should_release == 'true'
        run: node scripts/check-stable-dependencies.mjs

      - name: Setup pnpm
        if: steps.version.outputs.should_release == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Install dependencies
        if: steps.version.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck / Lint
        if: steps.version.outputs.should_release == 'true'
        run: pnpm run lint

      - name: Run tests
        if: steps.version.outputs.should_release == 'true'
        run: pnpm run test

      - name: Build production assets
        if: steps.version.outputs.should_release == 'true'
        run: pnpm run build

      - name: Create release tag
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already exists on a different commit."
              exit 1
            fi
            echo "Tag ${TAG} already exists on this commit; reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Resume Craft ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Package release assets
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          (
            cd dist
            zip -r "../resume-craft-${VERSION}.zip" .
            tar -czf "../resume-craft-${VERSION}.tar.gz" .
          )
          sha256sum             "resume-craft-${VERSION}.zip"             "resume-craft-${VERSION}.tar.gz"             > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          ASSETS=(
            "resume-craft-${VERSION}.zip"
            "resume-craft-${VERSION}.tar.gz"
            "SHA256SUMS.txt"
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refreshing assets."
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}"               --verify-tag               --title "Resume Craft ${TAG}"               --generate-notes               --latest
          fi
