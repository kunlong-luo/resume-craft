    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#243078">
      <text x="129" y="138"># Alex Chen</text>
      <text x="129" y="160">Software Engineer</text>
      <text x="129" y="201">## Summary</text>
      <text x="129" y="221">Building delightful products</text>
      <text x="129" y="239">with design and technology.</text>
      <text x="129" y="283">## Experience</text>
      <text x="129" y="304">### Senior Software Engineer</text>
      <text x="129" y="325">Acme Corp · 2022 – Present</text>
      <text x="129" y="350">- Built scalable web apps</text>
      <text x="129" y="371">- Improved performance</text>
      <text x="129" y="414">## Skills</text>
      <text x="129" y="435">TypeScript · React · Vite</text>
    </g>

    <path d="M296 215c18-22 36-22 54 0" fill="none" stroke="#7182ff" stroke-width="7" stroke-linecap="round"/>
    <path d="M345 208l9 15-17 2" fill="#7182ff"/>

    <rect x="336" y="62" width="228" height="424" rx="14" fill="#fff"/>
    <text x="359" y="112" font-family="Inter,ui-sans-serif,system-ui" font-size="25" font-weight="800" fill="#12184d">Alex Chen</text>
    <text x="359" y="133" font-family="Inter,ui-sans-serif,system-ui" font-size="11" fill="#47507a">Software Engineer</text>
    <line x1="359" y1="153" x2="542" y2="153" stroke="#dce2f8"/>
    <text x="359" y="183" font-family="Inter,ui-sans-serif,system-ui" font-size="11" font-weight="800" fill="#12184d">SUMMARY</text>
    <text x="359" y="204" font-family="Inter,ui-sans-serif,system-ui" font-size="10" fill="#47507a">Building delightful products with</text>
    <text x="359" y="220" font-family="Inter,ui-sans-serif,system-ui" font-size="10" fill="#47507a">design and technology.</text>
    <text x="359" y="262" font-family="Inter,ui-sans-serif,system-ui" font-size="11" font-weight="800" fill="#12184d">EXPERIENCE</text>
    <circle cx="366" cy="289" r="4" fill="#2638bd"/>
    <line x1="366" y1="289" x2="366" y2="357" stroke="#8b97d6"/>
    <text x="381" y="291" font-family="Inter,ui-sans-serif,system-ui" font-size="10" font-weight="700" fill="#12184d">Senior Software Engineer</text>
    <text x="381" y="311" font-family="Inter,ui-sans-serif,system-ui" font-size="9" fill="#586083">Acme Corp · 2022 – Present</text>
    <text x="381" y="339" font-family="Inter,ui-sans-serif,system-ui" font-size="9" fill="#586083">• Built scalable applications</text>
    <text x="381" y="356" font-family="Inter,ui-sans-serif,system-ui" font-size="9" fill="#586083">• Improved performance</text>
    <text x="359" y="401" font-family="Inter,ui-sans-serif,system-ui" font-size="11" font-weight="800" fill="#12184d">SKILLS</text>
    <g font-family="Inter,ui-sans-serif,system-ui" font-size="8.8" fill="#29336d">
      <rect x="359" y="415" width="51" height="20" rx="10" fill="#eef1ff"/>
      <text x="372" y="429">React</text>
      <rect x="417" y="415" width="69" height="20" rx="10" fill="#eef1ff"/>
      <text x="428" y="429">TypeScript</text>
      <rect x="493" y="415" width="48" height="20" rx="10" fill="#eef1ff"/>
      <text x="506" y="429">Vite</text>
    </g>
  </g>
</svg>