<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Resume Craft — Local-first Markdown Resume Builder</title>
  <desc id="desc">Social preview card for Resume Craft with a Markdown editor and live resume preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b72"/>
      <stop offset="0.55" stop-color="#263bd6"/>
      <stop offset="1" stop-color="#754cff"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#08103e" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 95C190 10 374 20 570 110S955 190 1200 54V0H0Z" fill="#fff" opacity=".07"/>
  <path d="M0 522C220 620 435 575 640 512S1018 440 1200 520V630H0Z" fill="#081052" opacity=".28"/>
  <circle cx="1070" cy="105" r="145" fill="#9d8bff" opacity=".12"/>

  <g transform="translate(58 74)">
    <rect width="68" height="82" rx="15" fill="#eef2ff"/>
    <path d="M45 0l23 23H55a10 10 0 0 1-10-10Z" fill="#8797ff"/>
    <rect x="14" y="35" width="37" height="7" rx="3.5" fill="#4f46e5"/>
    <rect x="14" y="51" width="42" height="7" rx="3.5" fill="#4f46e5"/>
    <rect x="14" y="67" width="29" height="7" rx="3.5" fill="#4f46e5"/>
  </g>

  <text x="58" y="230" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="64" font-weight="800" fill="#fff">Resume Craft</text>
  <text x="58" y="280" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="27" font-weight="750" fill="#dfe5ff">Local-first Markdown Resume Builder</text>
  <text x="58" y="326" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" fill="#cfd7ff">Edit in Markdown or forms. Preview A4 / Letter live.</text>

  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#fff">
    <rect x="58" y="365" width="190" height="42" rx="21" fill="#fff" opacity=".12"/>
    <text x="80" y="392">Live Preview</text>
    <rect x="260" y="365" width="150" height="42" rx="21" fill="#fff" opacity=".12"/>
    <text x="284" y="392">ATS Checks</text>
    <rect x="58" y="420" width="145" height="42" rx="21" fill="#fff" opacity=".12"/>
    <text x="84" y="447">Auto Fit</text>
    <rect x="215" y="420" width="155" height="42" rx="21" fill="#fff" opacity=".12"/>
    <text x="241" y="447">PDF Export</text>
  </g>

  <text x="58" y="530" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" fill="#dfe5ff">Open source · Local-first · React + TypeScript</text>

  <g transform="translate(560 58)" filter="url(#shadow)">
    <rect width="582" height="514" rx="24" fill="url(#paper)" stroke="#d9e1ff" stroke-width="3"/>
    <rect width="582" height="44" rx="24" fill="#eef2ff"/>
    <circle cx="23" cy="22" r="6" fill="#ff625f"/>
    <circle cx="43" cy="22" r="6" fill="#ffbd44"/>
    <circle cx="63" cy="22" r="6" fill="#23c552"/>

    <rect x="18" y="62" width="82" height="424" rx="14" fill="#e9edff"/>
    <g font-family="Inter,ui-sans-serif,system-ui" font-size="11.5" font-weight="700" fill="#2638bd">
